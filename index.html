  const L=document.createElement("div");B.appendChild(L);
  const draw=()=>{L.innerHTML="";const k=norm(q.value.trim());let c=0;
   SN.forEach((n,i)=>{if(!k||norm(n).includes(k)){c++;L.appendChild(item((i+1)+". سورة "+n,"صفحة "+SP[i],()=>show(SP[i])))}});
   if(!c)L.textContent="لا توجد سورة بهذا الاسم"};
  q.oninput=draw;draw();if(window.innerWidth>700)q.focus()}
 else if(tab=="j"){JP.forEach((p,i)=>B.appendChild(item("الجزء "+(i+1),"صفحة "+p,()=>show(p))))}
 else if(tab=="ab"){renderAbout(B)}
 else if(tab=="d"){renderDua(B)}
 else if(tab=="r"){renderRecite(B)}
 else if(tab=="a"){renderAyahTab(B)}
 else if(tab=="q"){renderQuarters(B)}
 else if(tab=="p"){const q=document.createElement("input");q.id="pg";q.type="number";q.min=1;q.max=LAST;q.placeholder="رقم الصفحة (1 – 604)";B.appendChild(q);
  q.onkeydown=e=>{if(e.key=="Enter")show(+q.value)};
  B.appendChild(item("اذهب للصفحة","",()=>show(+q.value)));
  B.appendChild(item("مقدمة وملاحق المصحف","",()=>show(LAST+1)));
  B.appendChild(item("أول المصحف (الفاتحة)","",()=>show(1)));
  if(DP)B.appendChild(item("📲 تثبيت التطبيق على الشاشة","",()=>DP.prompt()));
  if(WEB)B.appendChild(item("العمل بدون إنترنت",localStorage.getItem(OK)?"✅ جاهز":"⏳ لم يكتمل تحميل الصفحات بعد",()=>offlineAll()))}
 else if(tab=="o"){
  B.appendChild(item("☀ إبقاء الشاشة مضيئة",WLOK?(S.awake?"✅ مفعّل":"⬜ معطّل"):"غير مدعوم في هذا المتصفح",toggleAwake));
  B.appendChild(item("🎧 التلاوة والتكرار للحفظ","المنشاوي · الشريم",()=>openPanel("r")));
  B.appendChild(item("🤲 الأدعية والأذكار","ختم القرآن · الصباح والمساء · السفر · الاستخارة…",()=>{dsel=null;openPanel("d")}));
  B.appendChild(item("📖 تفسير السعدي عند الضغط على الآية",S.tf?"✅ مفعّل":"⬜ معطّل",()=>{S.tf=!S.tf;save();render()}));
  if(WEB)B.appendChild(item("⬇ تحميل التفسير للعمل بدون إنترنت",localStorage.getItem(OK2)?"✅ جاهز":"⏳ لم يكتمل",()=>{try{localStorage.removeItem(OK2)}catch(e){}offlineT(true)}));
  B.appendChild(item("📱 حجم الصفحة",S.fill?"ملء الشاشة":"الصفحة كاملة",toggleFill));
  const n=document.createElement("p");n.style.cssText="font-size:13px;color:#555;line-height:1.7;margin:10px 4px";
  n.textContent="ملء الشاشة: تكبير الصفحة بحيث يملأ النص عرض الشاشة (مع قص الزخرفة الخارجية). الصفحة كاملة: تظهر الصفحة بالكامل بزخرفتها.";B.appendChild(n);B.appendChild(item("ℹ️ حول البرنامج","فكرة وإعداد · المراجع",()=>openPanel("ab")))}
 else{if(!S.marks.length){B.textContent="لا توجد علامات بعد. اضغط 📍 ثم اضغط على مكان الآية التي وقفت عندها."}
  S.marks.forEach((m,i)=>{const d=document.createElement("div");d.style.display="flex";
   const it=item((i==0?"⭐ ":"")+(m.i!==undefined&&MM?(()=>{const q=sa(m.i);return"سورة "+SN[q[0]-1]+" — آية "+q[1]})():surahsOf(m.p)[0])+" — صفحة "+m.p,new Date(m.t).toLocaleDateString("ar-EG"),()=>show(m.p,true));it.style.flex="1";
   const x=document.createElement("button");x.className="del";x.textContent="✕";x.onclick=()=>{S.marks.splice(i,1);save();render()};
   d.appendChild(it);d.appendChild(x);B.appendChild(d)})}}
/* تثبيت + عمل بدون إنترنت */
let DP=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e});
const OK2="mushaf_tf_ok_v3",OK="mushaf_offline_ok_v1",CN="mushaf-v1",WEB=/^https?:/.test(location.protocol);
async function offlineAll(){
 if(!WEB||!("caches" in window))return;
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 if(localStorage.getItem(OK))return;
 const c=await caches.open(CN),bar=$("dl"),T=Math.ceil(N/50);let fail=0;bar.style.display="block";
 for(let k=0;k<T;k++){const u=bname(k);bar.textContent="جاري تحميل المصحف للعمل بدون إنترنت… "+Math.round(k/T*100)+"%";
  try{if(!(await c.match(u))){const r=await fetch(u);if(!r.ok)throw 0;await c.put(u,r)}}catch(e){fail++}}
 if(fail){bar.textContent="لم يكتمل التحميل — افتح التطبيق وأنت متصل بالإنترنت وسيكمل";setTimeout(()=>bar.style.display="none",7000)}
 else{try{localStorage.setItem(OK,"1")}catch(e){}bar.textContent="✅ المصحف جاهز للعمل بدون إنترنت";setTimeout(()=>bar.style.display="none",3500)}}
if(WEB&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(async()=>{await offlineAll();offlineT()}).catch(()=>{});
async function offlineT(show){
 if(!WEB||!("caches" in window)||localStorage.getItem(OK2))return;
 const c=await caches.open(CN),bar=$("dl"),L=["map.js","q.js","ad.js"];for(let k=1;k<=TS.length;k++)L.push("tf"+k+".json");let fail=0;
 if(show)bar.style.display="block";
 for(let k=0;k<L.length;k++){if(show)bar.textContent="جاري تحميل التفسير… "+Math.round(k/L.length*100)+"%";
  try{if(!(await c.match(L[k]))){const r=await fetch(L[k]);if(!r.ok)throw 0;await c.put(L[k],r)}}catch(e){fail++}}
 if(!fail)try{localStorage.setItem(OK2,"1")}catch(e){}
 if(show){bar.textContent=fail?"لم يكتمل تحميل التفسير — تأكد من الاتصال":"✅ التفسير جاهز بدون إنترنت";setTimeout(()=>bar.style.display="none",3000)}}
/* إبقاء الشاشة مضيئة */
let WL=null;const WLOK="wakeLock" in navigator;
async function wakeOn(){if(!WLOK)return false;try{if(WL)return true;WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null});return true}catch(e){WL=null;return false}}
function wakeOff(){try{if(WL)WL.release()}catch(e){}WL=null}
async function toggleAwake(){S.awake=!S.awake;save();
 if(S.awake){const ok=await wakeOn();toast(ok?"الشاشة ستبقى مضيئة أثناء استخدام التطبيق":WLOK?"تعذّر تفعيلها الآن — جرّب بعد لمس الشاشة":"المتصفح لا يدعم هذه الخاصية")}
 else{wakeOff();toast("تم إيقاف إبقاء الشاشة مضيئة")}render()}
function toggleFill(){S.fill=!S.fill;save();applyZoom();toast(S.fill?"ملء الشاشة":"الصفحة كاملة");render()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"&&S.awake)wakeOn()});
document.addEventListener("pointerdown",()=>{if(S.awake&&!WL)wakeOn()},{passive:true});
addEventListener("resize",applyZoom);addEventListener("orientationchange",()=>setTimeout(applyZoom,250));
applyZoom();show(S.page,true);if(S.awake)wakeOn();
</script></body></html>
